<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <!-- Dunkelgrüner Hintergrund (Military) -->
  <rect width="256" height="256" fill="#1a1a2e" rx="32"/>

  <!-- Zielkreis (Outer Ring) -->
  <circle cx="128" cy="128" r="90" fill="none" stroke="#4ecca3" stroke-width="3" opacity="0.4"/>
  <circle cx="128" cy="128" r="70" fill="none" stroke="#4ecca3" stroke-width="2" opacity="0.5"/>
  <circle cx="128" cy="128" r="50" fill="none" stroke="#4ecca3" stroke-width="2" opacity="0.6"/>
  <circle cx="128" cy="128" r="30" fill="none" stroke="#4ecca3" stroke-width="2" opacity="0.7"/>

  <!-- Fadenkreuz -->
  <line x1="128" y1="38" x2="128" y2="218" stroke="#4ecca3" stroke-width="2" opacity="0.8"/>
  <line x1="38" y1="128" x2="218" y2="128" stroke="#4ecca3" stroke-width="2" opacity="0.8"/>

  <!-- Mörser Symbol (vereinfacht) -->
  <g transform="translate(128, 128)">
    <!-- Mörserrohr -->
    <rect x="-8" y="-50" width="16" height="50" fill="#e94560" rx="3"/>
    <!-- Grundplatte -->
    <ellipse cx="0" cy="0" rx="25" ry="8" fill="#e94560"/>
    <!-- Stütze -->
    <line x1="0" y1="0" x2="20" y2="20" stroke="#e94560" stroke-width="4"/>
    <circle cx="20" cy="20" r="3" fill="#e94560"/>
  </g>

  <!-- Zentrumsmarkierung -->
  <circle cx="128" cy="128" r="6" fill="#ffd700"/>

  <!-- ARAC Text (klein, unten) -->
  <text x="128" y="235" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="bold" fill="#4ecca3" text-anchor="middle">ARAC</text>
</svg>
